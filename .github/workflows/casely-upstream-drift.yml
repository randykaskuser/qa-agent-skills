name: Casely upstream drift check

# skills/casely is a vendored copy of JohnWayneeee/casely-qa-skill. Once a month,
# compare it against upstream and open (or update) an issue if upstream has moved.
# See skills/casely/NOTICE.md and .github/scripts/casely_drift.sh.

on:
  schedule:
    - cron: "0 9 1 * *"   # 09:00 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  UPSTREAM_REPO: JohnWayneeee/casely-qa-skill
  ISSUE_LABEL: casely-upstream

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Clone upstream
        run: git clone --depth 1 "https://github.com/${UPSTREAM_REPO}.git" upstream

      - name: Diff against vendored copy
        id: diff
        run: |
          .github/scripts/casely_drift.sh upstream skills/casely > drift.diff
          echo "upstream_sha=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "upstream_version=$(grep -m1 -oE 'version: "[^"]+"' upstream/skill/casely/SKILL.md | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
          echo "local_version=$(grep -m1 -oE 'version: "[^"]+"' skills/casely/SKILL.md | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
          if [ -s drift.diff ]; then
            echo "drifted=true" >> "$GITHUB_OUTPUT"
            echo "::warning::skills/casely has drifted from upstream"
            cat drift.diff
          else
            echo "drifted=false" >> "$GITHUB_OUTPUT"
            echo "skills/casely matches upstream ${UPSTREAM_REPO}@$(git -C upstream rev-parse --short HEAD)"
          fi

      - name: Open or update issue
        if: steps.diff.outputs.drifted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ steps.diff.outputs.upstream_sha }}
          UPSTREAM_VERSION: ${{ steps.diff.outputs.upstream_version }}
          LOCAL_VERSION: ${{ steps.diff.outputs.local_version }}
        run: |
          gh label create "$ISSUE_LABEL" --color D93F0B \
            --description "Vendored Casely differs from upstream" --force >/dev/null

          # Keep the diff to a size GitHub will accept in an issue body.
          head -c 60000 drift.diff > drift.trimmed
          [ "$(wc -c < drift.diff)" -gt 60000 ] && echo -e "\n... (truncated, run the workflow locally for the full diff)" >> drift.trimmed

          {
            echo "Upstream: https://github.com/${UPSTREAM_REPO}/tree/${UPSTREAM_SHA} (version \`${UPSTREAM_VERSION}\`)"
            echo "Vendored: \`skills/casely\` (version \`${LOCAL_VERSION}\`)"
            echo "Checked: $(date -u +%Y-%m-%d)"
            echo
            echo "The diff below is upstream (\`-\`) vs vendored (\`+\`), *after* applying the two intentional"
            echo "changes listed in \`skills/casely/NOTICE.md\`, so everything shown is real upstream movement."
            echo
            echo "To pull it in: copy \`skill/casely/\` from upstream over \`skills/casely/\`, re-apply the"
            echo "NOTICE.md changes, update the version in NOTICE.md, and re-run this workflow to confirm it's clean."
            echo
            echo '```diff'
            cat drift.trimmed
            echo '```'
          } > issue-body.md

          TITLE="Casely upstream has changed (upstream ${UPSTREAM_VERSION}, vendored ${LOCAL_VERSION})"
          EXISTING=$(gh issue list --label "$ISSUE_LABEL" --state open --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --title "$TITLE" --body-file issue-body.md
            gh issue comment "$EXISTING" --body "Re-checked on $(date -u +%Y-%m-%d): still drifted against upstream ${UPSTREAM_SHA:0:7}. Issue body updated with the current diff."
            echo "Updated issue #$EXISTING"
          else
            gh issue create --title "$TITLE" --label "$ISSUE_LABEL" --body-file issue-body.md
          fi
